# configs/eb-man-harness.yaml
# Harness VLA beta on EB-Manipulation (language-only, zero-shot).
model_name: qwen2.5:0.5b-instruct   # tiny model for pipeline validation; swap for a real model later
base_url: http://localhost:11434/v1  # Ollama (OpenAI-compatible). Change to point at llama.cpp/vLLM/etc.
api_key: ollama
temperature: 0.0
max_tokens: 1024

# Evaluation scope
down_sample_ratio: 1
eval_sets: []            # empty = all eval sets; e.g. ['base']
resolution: 500
language_only: 1         # beta is language-only by construction
exp_name: harness_beta

# Harness loop controls
max_turns: 12            # planner primitive invocations per episode
max_env_steps: 30        # env steps per episode (vla_act consumes several)
approach_dz: 8           # staging height above a target (voxels)
lift_dz: 6               # post-grasp lift (voxels)

# Global Memory
global_memory_path: ''   # empty = use the fixed manual seed
